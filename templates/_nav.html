<nav class="fixed top-0 inset-x-0 z-10">
    <div class="max-w-4xl mx-auto flex items-center justify-between py-3 px-6 text-white text-sm font-medium">
        <a href="{{ url_for('index') }}" class="text-base font-semibold">🎓 Student Performance Predictor</a>
        <div class="flex items-center gap-4">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard') }}" class="hover:underline">Dashboard</a>
                <a href="{{ url_for('history') }}" class="hover:underline">History</a>
                <span>Hi, {{ current_user.name }}</span>
                <a href="{{ url_for('auth.logout') }}" class="hover:underline">Logout</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="hover:underline">Login</a>
                <a href="{{ url_for('auth.signup') }}" class="hover:underline">Signup</a>
            {% endif %}
        </div>
    </div>
</nav>
