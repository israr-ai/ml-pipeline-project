services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-mlproject}
      POSTGRES_PASSWORD: ${DB_PASS:-mlproject}
      POSTGRES_DB: ${DB_NAME:-mlproject}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mlproject} -d ${DB_NAME:-mlproject}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    command: sh -c "python create_db.py && python application.py"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-mlproject}
      DB_PASS: ${DB_PASS:-mlproject}
      DB_NAME: ${DB_NAME:-mlproject}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
